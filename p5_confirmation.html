<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laundry King — Check Your Email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="account-creation.css" />
</head>
<body>

  <div class="auth-layout">

    <!-- ── LEFT: image + branding ── -->
    <div class="auth-left">
      <a href="p1_landing-page.html" class="auth-logo">
        <img src="logo/LK-Logo-White.png" alt="logo" class="auth-logo img">
        Laundry King
      </a>

      <div class="auth-brand">
        <p class="auth-brand__welcome">Welcome to</p>
        <h1 class="auth-brand__name">
          Laundry King
          <img src="landing page icons/crown (1).png" alt="crown" class="crown">
        </h1>
        <p class="auth-brand__tagline">Ang hari ng labada</p>
      </div>
    </div>

    <!-- ── RIGHT: check email confirmation ── -->
    <div class="auth-right">
      <div class="auth-form-wrap" style="text-align:center;">

        <h2 class="auth-title">Check your Email</h2>
        <p class="email-subtitle">Check for the verification code in your email to reset your password.</p>

        <!-- Envelope icon -->
        <div class="auth-icon">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="22" width="84" height="60" rx="12" stroke="#1a3a6b" stroke-width="6"/>
            <path d="M8 34 L50 58 L92 34" stroke="#1a3a6b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <button class="btn-primary" onclick="window.location.href='p2_login.html'">Back to Log In</button>

      </div>
    </div>
  </div>

</body>
</html>
