<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laundry King — Check Your Email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="account-creation.css" />
</head>
<body>

  <div class="auth-layout">

    <!-- ── LEFT: image + branding ── -->
    <div class="auth-left">
      <a href="landing.html" class="auth-logo">
        <svg width="26" height="26" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="14" r="13" stroke="#ffffff" stroke-width="2"/>
          <circle cx="14" cy="14" r="8" stroke="#ffffff" stroke-width="1.5"/>
          <circle cx="14" cy="14" r="3" fill="#ffffff"/>
          <path d="M14 5 A9 9 0 0 1 23 14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Laundry King
      </a>

      <div class="auth-brand">
        <p class="auth-brand__welcome">Welcome to</p>
        <h1 class="auth-brand__name">
          Laundry King
          <svg width="54" height="42" viewBox="0 0 54 42" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 36 L10 12 L27 28 L44 12 L50 36 Z" fill="white"/>
            <circle cx="4"  cy="12" r="4" fill="white"/>
            <circle cx="27" cy="6"  r="4" fill="white"/>
            <circle cx="50" cy="12" r="4" fill="white"/>
          </svg>
        </h1>
        <p class="auth-brand__tagline">Ang hari ng labada</p>
      </div>
    </div>

    <!-- ── RIGHT: check email confirmation ── -->
    <div class="auth-right">
      <div class="auth-form-wrap" style="text-align:center;">

        <h2 class="auth-title">Check your Email</h2>
        <p class="auth-subtitle">Lorem ipsum dolor sit amet, consectetur adipiscing elit,</p>

        <!-- Envelope icon -->
        <div class="auth-icon">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="22" width="84" height="60" rx="12" stroke="#1a3a6b" stroke-width="6"/>
            <path d="M8 34 L50 58 L92 34" stroke="#1a3a6b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <button class="btn-primary" onclick="window.location.href='login.html'">Back to Log In</button>

      </div>
    </div>
  </div>

</body>
</html>
