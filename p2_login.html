<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laundry King — Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="account-creation.css" />
</head>
<body>

  <div class="auth-layout">

    <!-- ── LEFT: image + branding ── -->
    <div class="auth-left">
      <a href="p1_landing-page.html" class="auth-logo">
        <img src="logo/LK-Logo-White.png" alt="logo" class="auth-logo img">
        Laundry King
      </a>

      <div class="auth-brand">
        <p class="auth-brand__welcome">Welcome to</p>
        <h1 class="auth-brand__name">
          Laundry King
          <!-- Crown icon -->
          <img src="landing page icons/crown (1).png" alt="crown" class="crown">
        </h1>
        <p class="auth-brand__tagline">Ang hari ng labada</p>
      </div>
    </div>

    <!-- ── RIGHT: login form ── -->
    <div class="auth-right">
      <div class="auth-form-wrap">

        <h2 class="auth-title">Welcome <span>Back!</span></h2>
        <p class="auth-subtitle">Enter your details to get started and enjoy the elite service from Laundry King!</p>

        <div class="form-group">
          <label class="form-label" for="email">Email or Username</label>
          <input
            class="form-input"
            type="text"
            id="email"
            placeholder="Enter your email"
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            class="form-input"
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
        </div>

        <div class="form-row">
          <label class="form-check">
            <input type="checkbox" id="remember" />
            Remember me
          </label>
          <a href="forgot-password.html" class="form-forgot">Forgot Password?</a>
        </div>

        <button class="btn-primary" onclick="window.location.href='dashboard.html'">Log In</button>

        <button class="btn-google">
          <!-- Google "G" icon -->
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
            <path d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
          </svg>
          Sign in with Google
        </button>

        <p class="auth-footer">
          Don't have an account? <a href="p3_signup.html">Sign Up</a>
        </p>

      </div>
    </div>
  </div>

</body>
</html>
