<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laundry King — Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="account-creation.css" />
</head>
<body>

  <div class="auth-layout">

    <!-- ── LEFT: image + branding ── -->
    <div class="auth-left">
      <a href="p1_landing-page.html" class="auth-logo">
        <img src="logo/LK-Logo-White.png" alt="logo" class="auth-logo img">
        Laundry King
      </a>

      <div class="auth-brand">
        <p class="auth-brand__welcome">Welcome to</p>
        <h1 class="auth-brand__name">
          Laundry King
          <svg width="54" height="42" viewBox="0 0 54 42" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 36 L10 12 L27 28 L44 12 L50 36 Z" fill="white"/>
            <circle cx="4"  cy="12" r="4" fill="white"/>
            <circle cx="27" cy="6"  r="4" fill="white"/>
            <circle cx="50" cy="12" r="4" fill="white"/>
          </svg>
        </h1>
        <p class="auth-brand__tagline">Ang hari ng labada</p>
      </div>
    </div>

    <!-- ── RIGHT: sign up form ── -->
    <div class="auth-right">
      <div class="auth-form-wrap">

        <h2 class="auth-title">Create an Account</h2>
        <p class="auth-subtitle">Be our noble guest by creating an account!</p>

        <div class="form-group">
          <label class="form-label" for="fullname">Full Name</label>
          <input
            class="form-input"
            type="text"
            id="fullname"
            placeholder="Enter your name"
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input
            class="form-input"
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            class="form-input"
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="new-password"
          />
        </div>

        <div class="form-group" style="margin-bottom: 28px;">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <input
            class="form-input"
            type="password"
            id="confirm-password"
            placeholder="Enter your password"
            autocomplete="new-password"
          />
        </div>

        <button class="btn-primary" onclick="window.location.href='login.html'">Sign up</button>

        <p class="auth-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </p>

      </div>
    </div>
  </div>

</body>
</html>
