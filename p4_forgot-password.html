<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laundry King — Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="account-creation.css" />
</head>
<body>

  <div class="auth-layout">

    <!-- ── LEFT: image + branding ── -->
    <div class="auth-left">
      <a href="landing.html" class="auth-logo">
        <img src="logo/LK-Logo-White.png" alt="logo" class="auth-logo img">
        Laundry King
      </a>

      <div class="auth-brand">
        <p class="auth-brand__welcome">Welcome to</p>
        <h1 class="auth-brand__name">
          Laundry King
          <img src="landing page icons/crown (1).png" alt="crown" class="crown">
        </h1>
        <p class="auth-brand__tagline">Ang hari ng labada</p>
      </div>
    </div>

    <!-- ── RIGHT: forgot password form ── -->
    <div class="auth-right">
      <div class="auth-form-wrap">

        <h2 class="auth-title" style="text-align:center;">Forgot Password</h2>
        <p class="auth-subtitle" style="text-align:center;">Enter email to reset password.</p>

        <div class="form-group" style="margin-bottom: 28px;">
          <label class="form-label" for="email">Email</label>
          <input
            class="form-input"
            type="email"
            id="email"
            placeholder="Enter your Email"
            autocomplete="email"
          />
        </div>

        <button class="btn-primary" onclick="window.location.href='p5_confirmation.html'">Reset Password</button>

      </div>
    </div>
  </div>

</body>
</html>
