<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laundry King — Transactions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="buttons.css" />
  <link rel="stylesheet" href="layout.css" />
  <link rel="stylesheet" href="main-styles.css" />
  <style>
    .data-table td[contenteditable="true"] {
      outline: 2px dashed rgba(42, 107, 181, 0.5);
      background: #f7fbff;
    }
    .icon-btn.editing {
      background: rgba(42, 107, 181, 0.08);
    }
  </style>
</head>
<body>

  <!-- ============================================================ SIDEBAR ============================================================ -->
  <aside class="sidebar">
    <div class="sidebar__logo">
      <img src = "logo/LK-Logo-Main.png" alt="logo" class="sidebar__logo">
      <span class="sidebar__brand">Laundry King</span>
    </div>

    <nav class="sidebar__nav">
      <div class="sidebar__section-label">Menu</div>
      <a class="nav-item" href="a1_dashboard.html">
        <img src="sidebar icons/dashboard.png" alt="dashboard" class="icons">
        Dashboard
      </a>
      <a class="nav-item" href="a2_inventory.html">
        <img src="sidebar icons/inventory.png" alt="inventory" class="icons">
        Inventory
      </a>
      <a class="nav-item" href="a3_laundry-status.html">
        <img src="sidebar icons/laundry.png" alt="laundry" class="icons">
        Laundry Status
      </a>
      <a class="nav-item active" href="a4_transactions.html">
        <img src="sidebar icons/file.png" alt="transactions" class="icons">
        Transactions
      </a>
      <a class="nav-item" href="a5_sales.html">
        <img src="sidebar icons/sales.png" alt="sales" class="icons">
        Sales
      </a>
    </nav>

    <nav class="sidebar__nav sidebar__nav--general">
      <div class="sidebar__section-label">General</div>
      <a class="nav-item" href="settings.html">
        <img src="sidebar icons/setting.png" alt="settings" class="icons">
        Settings
      </a>
      <a class="nav-item" href="profile.html">
        <img src="sidebar icons/user.png" alt="profile" class="icons">
        Profile
      </a>
      <a class="nav-item" href="logout.html">
        <img src="sidebar icons/logout.png" alt="log out" class="icons">
        Log Out
      </a>
    </nav>
  </aside>

  <!-- ============================================================ MAIN ============================================================ -->
  <main class="main">

    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar__user">
        <div class="topbar__avatar">UN</div>
        <div class="topbar__info">
          <span class="topbar__name">User Name</span>
          <span class="topbar__email">username@email.com</span>
        </div>
      </div>
    </div>

    <!-- Page Header -->
    <div class="page-header page-header--row">
      <div>
        <h1 class="page-header__title">Transactions</h1>
        <p class="page-header__sub">Here are your previous transactions.</p>
      </div>
      <div class="inv-actions">
        <button id="txn-edit-btn" class="icon-btn" title="Edit">
          <img src="other icons/edit.png" alt="edit" class="btn-png">
        </button>
        <button id="txn-add-btn" class="icon-btn" title="Add">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Today -->
    <div class="txn-section">
      <select class="transactions-dropdown" id="txn-filter">
        <option value="today">Today</option>
        <option value="yesterday">Yesterday</option>
        <option value="week">This Week</option>
        <option value="last-week">Last Week</option>
        <option value="month">This Month</option>
        <option value="last-month">Last Month</option>
        <option value="three-months">Last 3 Months</option>
      </select>

      <div class="data-table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Transaction ID</th>
              <th>User ID</th>
              <th>Username</th>
              <th>Laundry Service</th>
              <th>Amount</th>
              <th>Payment Status</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    const STORAGE_KEY = 'laundryKingTransactions';
    const defaultData = {
      today: [
        ['019283', '0192748', 'Rizal Park', 'Full Service', '350', 'Paid'],
        ['019284', '0192749', 'John Doe', 'Dry Only', '200', 'Paid'],
        ['019285', '0192750', 'Jane Smith', 'Full Service', '350', 'Paid'],
      ],
      yesterday: [
        ['019280', '0192745', 'Mike Johnson', 'Dry Only', '450', 'Paid'],
        ['019281', '0192746', 'Alice Brown', 'Full Service', '200', 'Pending'],
      ],
      week: [
        ['019270', '0192735', 'Bob Wilson', 'Full Service', '350', 'Paid'],
        ['019271', '0192736', 'Sarah Davis', 'Full Service', '150', 'Paid'],
        ['019272', '0192737', 'Tom Harris', 'Full Service', '350', 'Paid'],
      ],
      'last-week': [
        ['019260', '0192725', 'Emma Wilson', 'Quick Wash', '200', 'Paid'],
        ['019261', '0192726', 'Chris Martin', 'Dry Clean', '450', 'Paid'],
      ],
      month: [
        ['019250', '0192715', 'Lisa Anderson', 'Full Service', '350', 'Paid'],
        ['019251', '0192716', 'David Lee', 'Quick Wash', '200', 'Paid'],
        ['019252', '0192717', 'Rachel Green', 'Express Wash', '150', 'Paid'],
      ],
      'last-month': [
        ['019240', '0192705', 'Kevin White', 'Full Service', '350', 'Paid'],
      ],
      'three-months': [
        ['019230', '0192695', 'Maria Garcia', 'Dry Clean', '450', 'Paid'],
        ['019231', '0192696', 'James Brown', 'Quick Wash', '200', 'Paid'],
      ]
    };

    const dropdown = document.getElementById('txn-filter');
    const tableBody = document.querySelector('.data-table tbody');
    const editButton = document.getElementById('txn-edit-btn');
    const addButton = document.getElementById('txn-add-btn');

    let tableData = loadTableData();
    let currentFilter = dropdown.value || 'today';

    function loadTableData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? JSON.parse(stored) : defaultData;
    }

    function saveTableData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tableData));
    }

    function renderRow(row) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row[0]}</td>
        <td>${row[1]}</td>
        <td>${row[2]}</td>
        <td>${row[3]}</td>
        <td>${row[4]}</td>
        <td><span class="paid-badge">${row[5]}</span></td>
      `;
      tableBody.appendChild(tr);
    }

    function populateTable(filterKey) {
      currentFilter = filterKey;
      tableBody.innerHTML = '';
      const rows = tableData[filterKey] || [];
      rows.forEach(renderRow);
      if (editButton.classList.contains('editing')) {
        setEditing(true);
      }
    }

    function setEditing(enabled) {
      tableBody.querySelectorAll('td').forEach(td => {
        td.contentEditable = enabled;
        td.classList.toggle('editable', enabled);
      });
      editButton.classList.toggle('editing', enabled);
      editButton.title = enabled ? 'Finish editing' : 'Edit';
    }

    function saveCurrentRows() {
      const rows = Array.from(tableBody.querySelectorAll('tr'));
      tableData[currentFilter] = rows.map(row => {
        const cells = row.querySelectorAll('td');
        return [
          cells[0].innerText.trim(),
          cells[1].innerText.trim(),
          cells[2].innerText.trim(),
          cells[3].innerText.trim(),
          cells[4].innerText.trim(),
          cells[5].innerText.trim()
        ];
      });
      saveTableData();
    }

    function addTransactionRow() {
      tableData[currentFilter] = tableData[currentFilter] || [];
      tableData[currentFilter].push(['', '', '', '', '', 'Pending']);
      populateTable(currentFilter);
      setEditing(true);
      const firstCell = tableBody.querySelector('td');
      firstCell?.focus();
    }

    dropdown.addEventListener('change', (e) => {
      if (editButton.classList.contains('editing')) {
        saveCurrentRows();
        setEditing(false);
      }
      populateTable(e.target.value);
    });

    editButton.addEventListener('click', () => {
      const isEditing = !editButton.classList.contains('editing');
      setEditing(isEditing);
      if (!isEditing) {
        saveCurrentRows();
      } else {
        const firstCell = tableBody.querySelector('td');
        firstCell?.focus();
      }
    });

    addButton.addEventListener('click', () => {
      addTransactionRow();
    });

    window.addEventListener('beforeunload', () => {
      if (editButton.classList.contains('editing')) {
        saveCurrentRows();
      }
    });

    populateTable(currentFilter);
  </script>
</body>
</html>
