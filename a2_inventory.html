<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laundry King — Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="buttons.css" />
  <link rel="stylesheet" href="layout.css" />
  <link rel="stylesheet" href="main-styles.css" />
  <style>
    .data-table td[contenteditable="true"] {
      outline: 2px dashed rgba(42, 107, 181, 0.5);
      background: #f7fbff;
    }

    .icon-btn.editing {
      background: rgba(42, 107, 181, 0.08);
    }
  </style>
</head>
<body>

  <!-- ============================================================ SIDEBAR ============================================================ -->
  <aside class="sidebar">
    <div class="sidebar__logo">
      <img src = "logo/LK-Logo-Main.png" alt="logo" class="sidebar__logo">
      <span class="sidebar__brand">Laundry King</span>
    </div>

    <nav class="sidebar__nav">
      <div class="sidebar__section-label">Menu</div>
      <a class="nav-item" href="a1_dashboard.html">
        <img src="sidebar icons/dashboard.png" alt="dashboard" class="icons">
        Dashboard
      </a>
      <a class="nav-item active" href="a2_inventory.html">
        <img src="sidebar icons/inventory.png" alt="inventory" class="icons">
        Inventory
      </a>
      <a class="nav-item" href="a3_laundry-status.html">
        <img src="sidebar icons/laundry.png" alt="laundry status" class="icons">
        Laundry Status
      </a>
      <a class="nav-item" href="a4_transactions.html">
        <img src="sidebar icons/file.png" alt="transactions" class="icons">
        Transactions
      </a>
      <a class="nav-item" href="a5_sales.html">
        <img src="sidebar icons/sales.png" alt="sales" class="icons">
        Sales
      </a>
    </nav>

    <nav class="sidebar__nav sidebar__nav--general">
      <div class="sidebar__section-label">General</div>
      <a class="nav-item" href="settings.html">
        <img src="sidebar icons/setting.png" alt="settings" class="icons">
        Settings
      </a>
      <a class="nav-item" href="profile.html">
        <img src="sidebar icons/user.png" alt="profile" class="icons">
        Profile
      </a>
      <a class="nav-item" href="logout.html">
        <img src="sidebar icons/logout.png" alt="logout" class="icons">
        Log Out
      </a>
    </nav>
  </aside>

  <!-- ============================================================ MAIN ============================================================ -->
  <main class="main">

    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar__user">
        <div class="topbar__avatar">UN</div>
        <div class="topbar__info">
          <span class="topbar__name">User Name</span>
          <span class="topbar__email">username@email.com</span>
        </div>
      </div>
    </div>

    <!-- Page Header -->
    <div class="page-header page-header--row">
      <h1 class="page-header__title">Inventory</h1>
      <div class="page-header__search">
        <img src="other icons/search.png" alt="search" class="icons">
        <input type="text" placeholder="Search" />
      </div>
    </div>

    <!-- Inventory Summary Bar -->
    <div class="inv-summary">
      <div class="inv-count"><strong>13</strong> products</div>
      <div class="inv-progress-bar">
        <div class="inv-progress-seg" style="width:62%;background:#1a3a6b;"></div>
        <div class="inv-progress-seg" style="width:15%;background:#4fa3d1;"></div>
        <div class="inv-progress-seg" style="width:23%;background:#2a6bb5;"></div>
      </div>
      <div class="inv-legend">
        <span class="inv-legend-dot" style="background:#1a3a6b;"></span>In Stock: 8
        <span class="inv-legend-dot" style="background:#4fa3d1;margin-left:12px;"></span>Low Stock: 2
        <span class="inv-legend-dot" style="background:#2a6bb5;margin-left:12px;"></span>Out of Stock: 3
      </div>
      <div class="inv-actions">
        <button id="inventory-edit-btn" class="icon-btn" title="Edit">
          <img src="other icons/edit.png" alt="edit" class="btn-png">
        </button>
        <button class="icon-btn" title="Add">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Inventory Table -->
    <div class="data-table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Vendor</th>
            <th>Remarks</th>
            <th>Stock</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="inventory-body">
        </tbody>
      </table>
    </div>

  </main>

  <script>
    const STORAGE_KEY = 'laundryKingInventory';
    const invBody = document.getElementById('inventory-body');

    function getDefaultData() {
      return Array.from({ length: 13 }, () => ({
        name: 'Downy na Pula',
        category: 'Fabcon',
        vendor: 'Sa shapi binili',
        remarks: '3L',
        stock: 3,
        status: 'In Stock'
      }));
    }

    function loadInventoryData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : getDefaultData();
    }

    function renderInventory(data) {
      invBody.innerHTML = '';
      data.forEach(r => {
        invBody.innerHTML += `<tr>
          <td>${r.name}</td>
          <td>${r.category}</td>
          <td>${r.vendor}</td>
          <td>${r.remarks}</td>
          <td>${r.stock}</td>
          <td><span class="status-badge-instock">${r.status}</span></td>
        </tr>`;
      });
    }

    function saveInventoryData() {
      const rows = Array.from(invBody.querySelectorAll('tr'));
      const data = rows.map(row => {
        const cells = row.querySelectorAll('td');
        return {
          name: cells[0].innerText.trim(),
          category: cells[1].innerText.trim(),
          vendor: cells[2].innerText.trim(),
          remarks: cells[3].innerText.trim(),
          stock: cells[4].innerText.trim(),
          status: cells[5].innerText.trim()
        };
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    renderInventory(loadInventoryData());

    const editButton = document.getElementById('inventory-edit-btn');
    editButton.addEventListener('click', () => {
      const isEditing = editButton.classList.toggle('editing');
      editButton.title = isEditing ? 'Finish editing' : 'Edit';

      invBody.querySelectorAll('td').forEach(td => {
        td.contentEditable = isEditing;
        td.classList.toggle('editable', isEditing);
      });

      if (isEditing) {
        const firstCell = invBody.querySelector('td[contenteditable="true"]');
        firstCell?.focus();
      } else {
        saveInventoryData();
      }
    });

    window.addEventListener('beforeunload', () => {
      const editing = editButton.classList.contains('editing');
      if (editing) {
        saveInventoryData();
      }
    });
  </script>
</body>
</html>
