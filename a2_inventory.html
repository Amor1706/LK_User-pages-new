<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laundry King — Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="buttons.css" />
  <link rel="stylesheet" href="layout.css" />
  <link rel="stylesheet" href="main-styles.css" />
</head>
<body>

  <!-- ============================================================ SIDEBAR ============================================================ -->
  <aside class="sidebar">
    <div class="sidebar__logo">
      <img src = "logo/LK-Logo-Main.png" alt="logo" class="sidebar__logo">
      <span class="sidebar__brand">Laundry King</span>
    </div>

    <nav class="sidebar__nav">
      <div class="sidebar__section-label">Menu</div>
      <a class="nav-item" href="a1_dashboard.html">
        <img src="icons/dashboard.png" alt="dashboard" class="icons">
        Dashboard
      </a>
      <a class="nav-item active" href="a2_inventory.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        </svg>
        Inventory
      </a>
      <a class="nav-item" href="a3_laundry-status.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
        </svg>
        Laundry Status
      </a>
      <a class="nav-item" href="a4_transactions.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
        </svg>
        Transactions
      </a>
      <a class="nav-item" href="a5_sales.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        Sales
      </a>
    </nav>

    <nav class="sidebar__nav sidebar__nav--general">
      <div class="sidebar__section-label">General</div>
      <a class="nav-item" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
        </svg>
        Settings
      </a>
      <a class="nav-item" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        Profile
      </a>
      <a class="nav-item" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Log Out
      </a>
    </nav>
  </aside>

  <!-- ============================================================ MAIN ============================================================ -->
  <main class="main">

    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar__user">
        <div class="topbar__avatar">UN</div>
        <div class="topbar__info">
          <span class="topbar__name">User Name</span>
          <span class="topbar__email">username@email.com</span>
        </div>
      </div>
    </div>

    <!-- Page Header -->
    <div class="page-header page-header--row">
      <h1 class="page-header__title">Inventory</h1>
      <div class="page-header__search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7a99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" placeholder="Search" />
      </div>
    </div>

    <!-- Inventory Summary Bar -->
    <div class="inv-summary">
      <div class="inv-count"><strong>13</strong> products</div>
      <div class="inv-progress-bar">
        <div class="inv-progress-seg" style="width:62%;background:#1a3a6b;"></div>
        <div class="inv-progress-seg" style="width:15%;background:#4fa3d1;"></div>
        <div class="inv-progress-seg" style="width:23%;background:#2a6bb5;"></div>
      </div>
      <div class="inv-legend">
        <span class="inv-legend-dot" style="background:#1a3a6b;"></span>In Stock: 8
        <span class="inv-legend-dot" style="background:#4fa3d1;margin-left:12px;"></span>Low Stock: 2
        <span class="inv-legend-dot" style="background:#2a6bb5;margin-left:12px;"></span>Out of Stock: 3
      </div>
      <div class="inv-actions">
        <button class="icon-btn" title="Export">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
        <button class="icon-btn" title="Add">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Inventory Table -->
    <div class="data-table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>Name ↑</th>
            <th>Category</th>
            <th>Vendor</th>
            <th>Remarks</th>
            <th>Stock</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="inventory-body">
        </tbody>
      </table>
    </div>

  </main>

  <script>
    // Populate Inventory table rows
    const invData = Array.from({ length: 13 }, () => ({
      name: 'Downy na Pula',
      category: 'Fabcon',
      vendor: 'Sa shapi binili',
      remarks: '3L',
      stock: 3,
      status: 'In Stock'
    }));

    const invBody = document.getElementById('inventory-body');
    invData.forEach(r => {
      invBody.innerHTML += `<tr>
        <td>${r.name}</td>
        <td>${r.category}</td>
        <td>${r.vendor}</td>
        <td>${r.remarks}</td>
        <td>${r.stock}</td>
        <td><span class="status-badge-instock">${r.status}</span></td>
      </tr>`;
    });
  </script>
</body>
</html>
